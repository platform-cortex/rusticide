# taplo does not read .gitignore: without this it formats build output, e.g.
# the target/package/*/Cargo.toml that `cargo publish --dry-run` writes.
# mise.local.toml is generated per machine by `mise run setup` and git-ignored.
exclude = ["**/target/**", "dist/**", "**/worktrees/**", "mise.local.toml"]

[formatting]
indent_string = "  "
indent_table = true
reorder_keys = true

[schema]
# Cargo.toml uses [lints.rust] which the SchemaStore schema doesn't recognize.
# Disable schema validation to suppress false-positive warnings.
enabled = false
