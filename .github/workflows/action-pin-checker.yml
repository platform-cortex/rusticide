name: Action Pin Checker

concurrency:
  group: action-pin-checker-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

on:
  workflow_dispatch:

permissions: read-all

jobs:
  action-pins:
    name: Action SHA Pins
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The script declares its interpreter (>=3.14) and httpx inline (PEP 723).
      # `uv run --script` honours both; `pipx install httpx` + bare `python3`
      # did neither -- pipx isolates httpx where python3 cannot import it.
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Verify action pins are up-to-date
        run: uv run --script scripts/update-actions-pins.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
