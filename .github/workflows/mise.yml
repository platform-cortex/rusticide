# Proves the tool manifest still installs: every [tools] entry in mise.toml,
# resolved through mise.lock, on a clean runner. cicd.yml runs the gates with
# MISE_TASK_RUN_AUTO_INSTALL=false, so a pin that no longer resolves would
# otherwise surface only on a contributor's first `mise run setup`.
name: Mise

concurrency:
  group: mise-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

on:
  pull_request:
    branches: [main]
    paths:
      - "mise.toml"
      - "mise.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/mise.yml"
  push:
    branches: [main]
    paths:
      - "mise.toml"
      - "mise.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/mise.yml"
  workflow_dispatch:
  # Weekly, because `latest` pins move without any change in this repository.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  install:
    name: Tool manifest installs
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5

      # install: true (the default) is the test: it installs every [tools]
      # entry from mise.lock and fails on any that no longer resolves.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false

      - name: Every task still parses
        run: mise tasks ls --all >/dev/null
