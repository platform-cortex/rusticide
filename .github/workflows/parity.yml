name: parity

# Manual dispatch only. Today this runs the operator schema corpus round-trip
# (rusticide-schema against PyTorch's own schema list). SP2's oracle will bring
# the real parity jobs back; scripts/fetch-*.sh are kept for it.
on:
  workflow_dispatch: {}

permissions: read-all

jobs:
  schema-corpus:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust-env

      - name: Run the schema corpus round-trip
        run: cargo test -p rusticide-schema --test corpus
