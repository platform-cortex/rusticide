name: Nightly Fuzz & Bench

concurrency:
  group: nightly-fuz-bench-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check for fuzz targets
        id: has-fuzz
        run: |
          if [ -f crates/rusticide-fuzz/Cargo.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-fuzz
        if: steps.has-fuzz.outputs.found == 'true'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-fuzz

      - name: List targets
        if: steps.has-fuzz.outputs.found == 'true'
        id: list-targets
        working-directory: crates/rusticide-fuzz
        run: |
          targets=$(cargo +nightly fuzz list --fuzz-dir . | tr '\n' ' ')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Run fuzzer (5 min each)
        if: steps.has-fuzz.outputs.found == 'true'
        working-directory: crates/rusticide-fuzz
        env:
          FUZZ_TARGETS: ${{ steps.list-targets.outputs.targets }}
        run: |
          host="$(rustc +nightly -vV | awk '/^host:/{print $2}')"
          for target in $FUZZ_TARGETS; do
            echo "Fuzzing $target for 300s..."
            cargo +nightly fuzz run --fuzz-dir . "$target" --target "$host" -- -max_total_time=300
          done

      - name: Upload crash artifacts
        if: failure() && steps.has-fuzz.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash
          path: crates/rusticide-fuzz/artifacts/

  bench:
    name: Benchmarks
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-env
        with:
          toolchain: "nightly"
          cache-key-suffix: nightly

      - name: Check for benchmarks
        id: has-benches
        run: |
          if find crates -type d -name benches 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks
        if: steps.has-benches.outputs.found == 'true'
        run: cargo bench --workspace

      - name: Upload results
        if: steps.has-benches.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-results
          path: target/criterion/

  miri:
    name: Miri (UB / strict-provenance)
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5
        with:
          components: miri

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo miri test
        run: cargo +nightly miri test --workspace
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"
