# Delivers a release: native builds for every supported platform, a source
# SBOM, SHA256SUMS, keyless Sigstore signatures and GitHub artifact
# attestations, published as one GitHub release (draft first, public last).
#
# Every step is a `mise run release:*` task, so `mise run release:snapshot`
# reproduces it locally.
#
# Three ways in:
#   - cicd.yml calls it after its `tag` job pushes v<version>. A tag pushed
#     with GITHUB_TOKEN raises no workflow events, so a call is the only way
#     the release follows the tag without a PAT.
#   - pushing a v* tag by hand.
#   - workflow_dispatch: a dry run by default -- build, package and checksum,
#     publish nothing.
name: Publish

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish, without v (e.g. 0.1.0)"
        required: true
        type: string
      dry-run:
        description: "Build and package without publishing"
        required: false
        type: boolean
        default: true
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and package without publishing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  check:
    name: Check version and gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
      provenance: ${{ steps.check.outputs.provenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/<default branch>, for the ancestry check
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
          cache: false

      # A tag push always publishes; a call publishes when told dry-run=false;
      # a manual run publishes only when its dry-run box is unticked.
      - id: check
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ github.event_name == 'push' && 'false' || (inputs.dry-run == false && 'false' || 'true') }}
          PRIVATE: ${{ github.event.repository.private }}
          ATTEST: ${{ vars.ATTEST || 'auto' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          mise run -q release:check:ci --version "$VERSION" --dry-run "$DRY_RUN"
          --private "$PRIVATE" --attest "$ATTEST" --default-branch "$DEFAULT_BRANCH"
          >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Native runners only: every binary is smoke-run where it was built.
        # glibc builds use ubuntu-22.04 so they need at most GLIBC_2.34
        # (release:build:glibc enforces it); musl builds are fully static.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .cargo/config.toml links x86_64-unknown-linux-gnu with clang + mold.
      - name: Install clang and mold
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang mold

      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5
        with:
          targets: ${{ matrix.target }}

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
          cache: false

      - run: mise run release:build --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  package:
    name: SBOM and checksums
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: syft
          cache: false

      - run: mise run release:sums

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  sign-and-attest:
    name: Sign and attest
    needs: [check, package]
    if: needs.check.outputs.publish == 'true' && needs.check.outputs.provenance == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: cosign
          cache: false

      # One <file>.sigstore.json bundle per release file, and the archives
      # unpacked into binaries/ so the executables themselves can be attested.
      - run: mise run release:sign

      # Build provenance for every file SHA256SUMS lists (archives and SBOM).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # ...and for each unpacked binary, so a user can verify the executable
      # they run, not just the archive it came in.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: binaries/*/rusticide

      # The SBOM attestation binds the dependency graph to the same subjects.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/rusticide-${{ needs.check.outputs.version }}.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-files
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [check, package, sign-and-attest]
    # sign-and-attest is skipped, not failed, for a private repository; the
    # release then ships checksums only and its notes say so.
    if: >-
      !cancelled() && needs.check.outputs.publish == 'true' && needs.package.result == 'success'
      && (needs.sign-and-attest.result == 'success' || needs.check.outputs.provenance != 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.check.outputs.version }}
    steps:
      # The tag's commit, with history and tags: git-cliff renders the notes
      # from them and release:check matches the tag at HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.check.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.check.outputs.provenance == 'true' && 'signed-files' || 'release-files' }}
          path: dist

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: git-cliff
          cache: false

      - run: mise run release:notes --provenance "$PROVENANCE"
        env:
          PROVENANCE: ${{ needs.check.outputs.provenance }}

      # Draft first, with every file attached; public only once all uploaded,
      # so nobody can download a release that is still missing assets.
      - run: mise run release:github:draft

      - run: gh release edit "$TAG" --draft=false --latest

  crate:
    name: Publish crates to crates.io
    needs: [check, release]
    # Off until the repository variable CRATES_IO is "true". Trusted
    # Publishing needs each crate to exist on crates.io first, so the very
    # first upload is a manual `cargo publish` (docs: crates.io trusted publishing).
    if: >-
      !cancelled() && needs.release.result == 'success'
      && needs.check.outputs.publish == 'true' && vars.CRATES_IO == 'true'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.check.outputs.version }}
          persist-credentials: false

      - uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
          cache: false

      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - run: mise run release:crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
