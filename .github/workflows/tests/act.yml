name: act

on: push

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"

      - name: Install tmq (TOML Query Tool)
        id: tmq
        shell: bash
        run: |
          if ! command -v tmq &>/dev/null; then
            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64)  FILE="tmq-linux-amd64"   ;;
              aarch64) FILE="tmq-linux-arm64"   ;;
              arm64)   FILE="tmq-linux-arm64"   ;;
              *)       echo "Unsupported arch: $ARCH"; exit 1 ;;
            esac
            curl -fsSL "https://github.com/azolfagharj/tmq/releases/latest/download/$FILE" -o /usr/local/bin/tmq
            chmod +x /usr/local/bin/tmq
          fi
          tmq --version
          echo "rust_version=$(tmq rust-toolchain.toml '.toolchain.channel')" >> "$GITHUB_OUTPUT"
          echo "rust_profile=$(tmq rust-toolchain.toml '.toolchain.profile')" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        id: rust-toolchain
        uses: elioseverojunior/rust-toolchain@53d2299d557a901de7517771d4ce9e89b70d4439 # v0.8.0-5

      - name: Rust toolchain Cache
        id: rust-toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.tmq.outputs.rust_version }}-${{ hashFiles('**/Cargo.lock') || hashFiles('**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.tmq.outputs.rust_version }}-
            rust-${{ runner.os }}-${{ runner.arch }}-
            rust-${{ runner.os }}-

      - name: Setup Rust toolchain list
        id: rustup-toolchain-list
        shell: bash -l {0}
        run: |
          #!/usr/bin/env bash

          set -eo pipefail

          echo "Rust toolchain list"
          rustup toolchain list

      - name: Rust toolchain Cache
        id: rust-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.tmq.outputs.rust_version }}-${{ hashFiles('Cargo.lock') || hashFiles('Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.tmq.outputs.rust_version }}-
            rust-${{ runner.os }}-${{ runner.arch }}-
            rust-${{ runner.os }}-

      - name: Get Rust version
        id: rust-version
        shell: bash -l {0}
        run: |
          echo "Rust Version=$(rustc --version)"

      - name: Setup mise
        id: mise-setup
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache_key_prefix: mise
          cache_key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') || hashFiles('mise.toml') }}
