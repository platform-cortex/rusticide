name: "CodeQL Analysis"

on:
  # cicd.yml's SAST job calls this on every push and pull request; its own
  # push/pull_request triggers would analyse the same commit twice.
  workflow_call:
  schedule:
    - cron: '0 12 * * 0'

# Least privilege at the top level; the analyze job elevates itself to the
# security-events: write it needs to upload SARIF. Job-level permissions
# replace (not intersect with) the workflow-level ones, so this grants nothing
# to any other job that may be added later.
permissions: read-all

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
