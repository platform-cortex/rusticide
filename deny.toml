[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
external-default-features = "allow"
highlight = "all"
multiple-versions = "warn"
# zerocopy-derive (via half) is still on syn 2 while serde and thiserror use
# syn 3; both are proc-macro build dependencies, nothing ships twice.
skip = [
  { crate = "syn@2", reason = "zerocopy-derive (via half) still uses syn 2" },
]
wildcards = "allow"
workspace-default-features = "allow"

[sources]
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"
