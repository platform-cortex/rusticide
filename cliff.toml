# Only the commit_parsers block is generated from commit-types.toml by
# scripts/commit-config.py; edit everything else here by hand.
# Regenerate with `mise run commit-config`; `mise run commit-config:check` guards drift.

[changelog]
# Group labels are "<!-- order --><emoji> <Name>": striptags drops the order
# comment and the first word (the emoji) is dropped so the output stays ASCII.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | split(pat=" ") | slice(start=1) | join(sep=" ") }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
footer = "\n<!-- generated by git-cliff -->"
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n"
trim = true

[git]
conventional_commits = true
filter_unconventional = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"

# Strip the emoji shortcode prefix some commit subjects carry.
commit_preprocessors = [{ pattern = "^\\s*(:\\w+:)\\s*", replace = "" }]

# -- commit_parsers (generated from commit-types.toml) --
# >>> commit-config:parsers (generated from commit-types.toml -- do not edit) >>>
commit_parsers = [
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^docs", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { message = "^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { message = "^build", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { message = "^init", group = "<!-- 7 -->🎉 Repository Initialization" },
  { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
# <<< commit-config:parsers <<<
