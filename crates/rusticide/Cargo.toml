[package]
authors.workspace = true
categories.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "rusticide"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
cli = ["schema", "dispatch", "models", "dep:anyhow", "dep:clap"]
default = ["dispatch", "schema"]
dispatch = ["dep:rusticide-dispatch"]
io = ["dep:rusticide-io"]
models = [
  "io",
  "dep:rusticide-model",
  "dep:rusticide-llama",
  "dep:rusticide-tokenizer",
  "dep:rusticide-sampling",
]
schema = ["dep:rusticide-schema"]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
rusticide-core.workspace = true
rusticide-dispatch = { workspace = true, optional = true }
rusticide-io = { workspace = true, optional = true }
rusticide-llama = { workspace = true, optional = true }
rusticide-model = { workspace = true, optional = true }
rusticide-sampling = { workspace = true, optional = true }
rusticide-schema = { workspace = true, optional = true }
rusticide-tokenizer = { workspace = true, optional = true }

[dev-dependencies]
rusticide-llama = { workspace = true, features = ["testing"] }

[[bin]]
name = "rusticide"
path = "src/main.rs"
required-features = ["cli"]

[lints]
workspace = true
